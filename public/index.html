<!DOCTYPE html>
<html lang="en" class="bg-bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dispatchrr Dashboard</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --border: #e3e6ea;
        --foreground: #1c2128;
        --muted: #6b7280;
        --primary: #1f6feb;
        --primary-foreground: #ffffff;
        --high: #d1453b;
        --normal: #2563eb;
        --low: #6b7280;
        --urgent: #b91c1c;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--foreground);
        line-height: 1.5;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem 1.5rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      header h1 {
        font-size: 1.25rem;
        font-weight: 700;
      }

      header p {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .refresh-btn {
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--primary-foreground);
        background: var(--primary);
        border: none;
        border-radius: 8px;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }

      .refresh-btn:hover {
        opacity: 0.9;
      }

      main {
        padding: 1.5rem;
        display: flex;
        gap: 1.5rem;
        align-items: flex-start;
      }

      .column {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        width: 360px;
        max-width: 100%;
        overflow: hidden;
      }

      .column-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
      }

      .column-header h2 {
        font-size: 1rem;
        font-weight: 600;
      }

      .count-badge {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--primary);
        background: rgba(31, 111, 235, 0.1);
        border-radius: 999px;
        padding: 0.15rem 0.6rem;
      }

      .column-body {
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-height: calc(100vh - 220px);
        overflow-y: auto;
      }

      .job-card {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.9rem 1rem;
        background: var(--surface);
      }

      .job-card h3 {
        font-size: 0.95rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .job-card .customer {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.6rem;
      }

      .job-card .route {
        font-size: 0.8rem;
        color: var(--foreground);
        margin-bottom: 0.6rem;
      }

      .job-card .route span {
        color: var(--muted);
      }

      .job-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .priority {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
        color: var(--primary-foreground);
      }

      .priority.high { background: var(--high); }
      .priority.urgent { background: var(--urgent); }
      .priority.normal { background: var(--normal); }
      .priority.low { background: var(--low); }

      .due {
        font-size: 0.75rem;
        color: var(--muted);
      }

      .empty,
      .loading {
        padding: 2rem 1rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      /* ── Job card interactivity ─────────────────────────────── */
      .job-card {
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        will-change: transform;
      }

      .job-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        border-color: var(--primary);
      }

      .job-card:active {
        transform: translateY(0);
        box-shadow: none;
      }

      /* ── Detail overlay backdrop ────────────────────────────── */
      .detail-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        z-index: 100;
        pointer-events: none;
        transition: background 0.3s ease;
      }

      .detail-backdrop.open {
        background: rgba(0, 0, 0, 0.45);
        pointer-events: all;
      }

      /* ── Detail panel (slides in from right) ───────────────── */
      .detail-panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(520px, 100vw);
        background: var(--surface);
        border-left: 1px solid var(--border);
        z-index: 101;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: -8px 0 32px rgba(0, 0, 0, 0.12);
      }

      .detail-panel.open {
        transform: translateX(0);
      }

      .detail-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid var(--border);
        gap: 1rem;
      }

      .detail-panel-header h2 {
        font-size: 1.1rem;
        font-weight: 700;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .detail-close-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        border: none;
        background: var(--bg);
        border-radius: 8px;
        cursor: pointer;
        color: var(--muted);
        font-size: 1.1rem;
        flex-shrink: 0;
        transition: background 0.15s, color 0.15s;
      }

      .detail-close-btn:hover {
        background: var(--border);
        color: var(--foreground);
      }

      .detail-panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      /* ── Placeholder content ────────────────────────────────── */
      .detail-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        gap: 0.75rem;
        color: var(--muted);
        text-align: center;
        padding: 3rem 2rem;
      }

      .detail-placeholder .placeholder-icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: rgba(31, 111, 235, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.5rem;
      }

      .detail-placeholder h3 {
        font-size: 1rem;
        font-weight: 600;
        color: var(--foreground);
      }

      .detail-placeholder p {
        font-size: 0.85rem;
        max-width: 280px;
        line-height: 1.6;
      }

      /* ── Job detail summary strip ───────────────────────────── */
      .detail-summary {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .detail-summary .customer-name {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .detail-summary .route {
        font-size: 0.82rem;
        color: var(--foreground);
        line-height: 1.6;
      }

      .detail-summary .route span {
        color: var(--muted);
      }

      .detail-summary .meta-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Dispatchrr Dashboard</h1>
        <p>Live view of incoming dispatch jobs</p>
      </div>
      <button class="refresh-btn" id="refresh">Refresh</button>
    </header>

    <main>
      <section class="column">
        <div class="column-header">
          <h2>New Jobs</h2>
          <span class="count-badge" id="new-count">0</span>
        </div>
        <div class="column-body" id="new-jobs">
          <div class="loading">Loading jobs&hellip;</div>
        </div>
      </section>
    </main>

    <!-- Detail panel -->
    <div class="detail-backdrop" id="detail-backdrop"></div>
    <aside class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" aria-label="Job details">
      <div class="detail-panel-header">
        <h2 id="detail-title">Job Details</h2>
        <button class="detail-close-btn" id="detail-close" aria-label="Close details">&#x2715;</button>
      </div>
      <div class="detail-panel-body" id="detail-panel-body">
        <!-- populated by JS -->
      </div>
    </aside>

    <script>
      const fmtTime = (iso) => {
        if (!iso) return "—";
        try {
          return new Date(iso).toLocaleString([], {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch {
          return iso;
        }
      };

      // ── Detail panel ──────────────────────────────────────────
      const backdrop = document.getElementById("detail-backdrop");
      const panel = document.getElementById("detail-panel");
      const panelTitle = document.getElementById("detail-title");
      const panelBody = document.getElementById("detail-panel-body");
      const closeBtn = document.getElementById("detail-close");

      function openDetail(job) {
        panelTitle.textContent = job.title;

        panelBody.innerHTML = `
          <div class="detail-summary">
            <p class="customer-name">${job.customerName}</p>
            <p class="route">
              <span>From</span> ${job.pickupAddress}<br />
              <span>To</span> ${job.dropoffAddress}
            </p>
            <div class="meta-row">
              <span class="priority ${job.priority}">${job.priority}</span>
              <span class="due">Due ${fmtTime(job.dueAt)}</span>
            </div>
          </div>
          <div class="detail-placeholder">
            <div class="placeholder-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <path d="M3 9h18M9 21V9"/>
              </svg>
            </div>
            <h3>Full job details coming soon</h3>
            <p>This panel will show driver assignment, status timeline, contact info, notes, and more in a future iteration.</p>
          </div>`;

        backdrop.classList.add("open");
        panel.classList.add("open");
        panel.focus();
        document.addEventListener("keydown", handleEsc);
      }

      function closeDetail() {
        backdrop.classList.remove("open");
        panel.classList.remove("open");
        document.removeEventListener("keydown", handleEsc);
      }

      function handleEsc(e) {
        if (e.key === "Escape") closeDetail();
      }

      closeBtn.addEventListener("click", closeDetail);
      backdrop.addEventListener("click", closeDetail);

      // ── Card rendering ────────────────────────────────────────
      let jobsCache = [];

      const jobCard = (job) => `
        <article class="job-card" data-job-id="${job.id}" tabindex="0" role="button" aria-label="View details for ${job.title}">
          <h3>${job.title}</h3>
          <p class="customer">${job.customerName}</p>
          <p class="route">
            <span>From</span> ${job.pickupAddress}<br />
            <span>To</span> ${job.dropoffAddress}
          </p>
          <div class="job-meta">
            <span class="priority ${job.priority}">${job.priority}</span>
            <span class="due">Due ${fmtTime(job.dueAt)}</span>
          </div>
        </article>`;

      function bindCardClicks() {
        document.querySelectorAll(".job-card[data-job-id]").forEach((card) => {
          card.addEventListener("click", () => {
            const job = jobsCache.find((j) => j.id === card.dataset.jobId);
            if (job) openDetail(job);
          });
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              card.click();
            }
          });
        });
      }

      async function loadDashboard() {
        const container = document.getElementById("new-jobs");
        const countEl = document.getElementById("new-count");
        container.innerHTML = '<div class="loading">Loading jobs&hellip;</div>';

        try {
          const res = await fetch("/api/jobs?status=new");
          if (!res.ok) throw new Error("Request failed: " + res.status);
          const { jobs } = await res.json();

          jobsCache = jobs;
          countEl.textContent = jobs.length;

          if (!jobs.length) {
            container.innerHTML = '<div class="empty">No new jobs right now.</div>';
            return;
          }

          container.innerHTML = jobs.map(jobCard).join("");
          bindCardClicks();
        } catch (err) {
          console.log("[v0] dashboard load error:", err.message);
          container.innerHTML =
            '<div class="empty">Could not load jobs. Is the API running?</div>';
        }
      }

      document.getElementById("refresh").addEventListener("click", loadDashboard);
      loadDashboard();
    </script>
  </body>
</html>
